[www]
; Only pass through the variables the app needs, rather than the whole
; process environment (clear_env = no would expose SMTP_PASS to every script).
clear_env = yes
env[SMTP_HOST]         = $SMTP_HOST
env[SMTP_PORT]         = $SMTP_PORT
env[SMTP_USER]         = $SMTP_USER
env[SMTP_FROM]         = $SMTP_FROM
env[SMTP_PASS]         = $SMTP_PASS
env[SMTP_HELO]         = $SMTP_HELO
env[SMTP_TLS]          = $SMTP_TLS
env[CONTACT_RECIPIENT] = $CONTACT_RECIPIENT
env[SITE_ORIGIN]       = $SITE_ORIGIN

php_admin_value[expose_php] = Off
