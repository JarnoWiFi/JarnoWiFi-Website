services:
  web:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      - "1212:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  php:
    image: php:8.2-fpm-alpine
    volumes:
      - ./docs:/var/www/html:ro
      - ./php-fpm-env.conf:/usr/local/etc/php-fpm.d/zz-env.conf:ro
    environment:
      SMTP_HOST: ${SMTP_HOST:-mail.treudler.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-system@treudler.net}
      SMTP_FROM: ${SMTP_FROM:-system@treudler.net}
      SMTP_HELO: ${SMTP_HELO:-jarnowifi.net}
      SMTP_TLS: ${SMTP_TLS:-1}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-contact@jarnowifi.net}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://jarnowifi.net}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
