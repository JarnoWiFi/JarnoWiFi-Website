name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring

      - name: Lint PHP
        run: find docs -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON data
        run: |
          for f in docs/locales/translations.json docs/data/blog-posts.json docs/site.webmanifest; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo "ok: $argv[1]\n";' "$f"
          done

      - name: Check locale parity and content integrity
        run: python3 tools/check-content.py

      - name: Validate nginx config
        run: |
          docker run --rm --add-host php:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Validate compose file
        run: SMTP_PASS=ci-placeholder docker compose config -q

      - name: Smoke test the running site
        run: |
          printf 'SMTP_PASS=ci-placeholder\nSITE_ORIGIN=http://localhost:1212\n' > .env
          docker compose up -d --wait
          python3 tools/smoke-test.py
          docker compose logs --no-color > /tmp/compose.log || true
          docker compose down

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose.log
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks *action* requires a paid licence on organisation-owned
      # repositories; the binary itself does not. Run it directly.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner --verbose
