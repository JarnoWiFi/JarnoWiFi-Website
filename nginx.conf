# Language negotiation for the bare paths. Behind a TLS-terminating proxy we
# honour X-Forwarded-Proto so redirects never downgrade https -> http.
map $http_accept_language $accept_language {
  ~*^de   de;
  ~*^en   en;
  default nl;
}

map $cookie_preferredLanguage $preferred_language {
  ~*^(en|de|nl)$ $1;
  default        "";
}

map $preferred_language $detected_language {
  ""      $accept_language;
  default $preferred_language;
}

map $http_x_forwarded_proto $public_scheme {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

# Throttle the contact endpoint: it sends mail through an authenticated account.
limit_req_zone $binary_remote_addr zone=contact_form:1m rate=10r/m;
limit_req_status 429;

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   256;
gzip_proxied      any;
gzip_types
  text/plain text/css text/xml text/javascript
  application/javascript application/json application/xml
  application/rss+xml application/manifest+json image/svg+xml;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root  /usr/share/nginx/html;
  index index.php index.html;

  charset utf-8;
  client_max_body_size 1m;

  # ------------------------------------------------------------ security
  add_header X-Content-Type-Options  "nosniff"                   always;
  add_header X-Frame-Options         "DENY"                      always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; upgrade-insecure-requests" always;

  # Never serve dotfiles or the raw partial templates.
  location ~ /\.            { deny all; }
  location ^~ /partials/    { internal; }
  location ^~ /locales/     { internal; }

  # -------------------------------------------------- language negotiation
  location = / {
    return 302 $public_scheme://$http_host/$detected_language/;
  }
  location = /jobs        { return 302 $public_scheme://$http_host/$detected_language/jobs; }
  location = /reliability { return 302 $public_scheme://$http_host/$detected_language/reliability; }
  location = /imprint     { return 302 $public_scheme://$http_host/$detected_language/imprint; }
  location = /privacy     { return 302 $public_scheme://$http_host/$detected_language/privacy; }
  location = /blog        { return 302 $public_scheme://$http_host/$detected_language/blog; }

  # ----------------------------------------------------------- static files
  # Hashed/derived assets are safe to pin; unversioned CSS/JS is not, so it
  # gets a short TTL and must revalidate — otherwise a deploy takes 30 days
  # to reach returning visitors.
  location ^~ /img/opt/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
  }
  location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|mp4|webm|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public" always;
  }
  location ~* \.(css|js)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate" always;
  }
  location = /robots.txt      { expires 1d; }
  location = /sitemap.xml {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/sitemap.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/html;
    fastcgi_pass  php:9000;
    fastcgi_hide_header X-Powered-By;
  }
  location = /site.webmanifest { expires 7d; }

  # ------------------------------------------------------ language routing
  # These must precede the generic \.php$ handler: the contact form posts to
  # /contact.php from a page served under /<lang>/, and browsers resolve that
  # relative to the language prefix.
  location ~ ^/(?:en|de|nl)/blog/([a-z0-9-]+)/?$ {
    try_files /nonexistent /blog/index.php;
  }
  location ~ ^/(?:en|de|nl)/blog/?$ {
    try_files /nonexistent /blog/index.php;
  }
  location ~ ^/(?:en|de|nl)/(imprint|jobs|reliability|privacy)/?$ {
    try_files /nonexistent /$1.php;
  }
  location ~ ^/(?:en|de|nl)/?$ {
    try_files /nonexistent /index.php;
  }
  location ~ ^/(?:en|de|nl)/(.+\.php)$ {
    try_files /nonexistent /$1;
  }
  location ~ ^/(?:en|de|nl)/(.*)$ {
    try_files /$1 /$1/ /index.php;
  }

  # --------------------------------------------------------- PHP execution
  location = /contact.php {
    limit_req zone=contact_form burst=3 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/contact.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/html;
    fastcgi_pass  php:9000;
    fastcgi_hide_header X-Powered-By;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   /var/www/html;
    fastcgi_pass  php:9000;
    fastcgi_hide_header X-Powered-By;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
